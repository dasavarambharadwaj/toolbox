[workspace]
members = [
    "crates/tb",
    "crates/tb-core",
    "crates/tb-deps",
    "crates/tb-ext",
    "crates/tb-cli",
    "crates/tb-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# External dependencies
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
slint = "1.18"
slint-build = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Internal workspace crates
tb-core = { path = "crates/tb-core" }
tb-deps = { path = "crates/tb-deps" }
tb-ext = { path = "crates/tb-ext" }
tb-cli = { path = "crates/tb-cli" }
tb-ui = { path = "crates/tb-ui" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
